[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "superdeterminism"
version = "0.1.0"
description = "Agnostic determinism advisor: ingest traces, map architecture, recommend tool vs LLM flips."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Superdeterminism contributors" }]
keywords = [
    "agents",
    "determinism",
    "observability",
    "opentelemetry",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Vinayak-RZ/superdeterminisiom"
Repository = "https://github.com/Vinayak-RZ/superdeterminisiom"
Issues = "https://github.com/Vinayak-RZ/superdeterminisiom/issues"
Documentation = "https://github.com/Vinayak-RZ/superdeterminisiom#table-of-contents"

[project.optional-dependencies]
dev = ["pytest>=8"]
langgraph = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
]
crewai = ["crewai>=0.80"]

[project.scripts]
superdeterminism = "superdeterminism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
